[workspace]
members = [
  "packages/shared-rust",
  "apps/desktop/src-tauri",
  "apps/mobile-android/src-tauri",
  "apps/mobile-ios/src-tauri"
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
strip = true
