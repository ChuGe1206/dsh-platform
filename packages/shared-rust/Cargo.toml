[package]
name = "shared-rust"
version = "0.1.0"
edition = "2021"
description = "Shared Rust types/helpers for dsh-platform native shells (desktop + mobile)."
license = "MIT"

[lib]
name = "shared_rust"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
