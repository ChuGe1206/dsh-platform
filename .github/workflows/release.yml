name: Release

# 发布流水线：tag v*（或手动触发）→ 全量构建 → 打包 NSIS/MSI → 上传产物 + GitHub Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动发布目标 tag（如 v0.1.2；release 已存在时追加资产）'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: 检出（含 harness 子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: 准备 harness / overlay / runtime
        run: node scripts/prepare-harness.mjs

      # 发布运行时注入（DSH CLI + 依赖复制到 src-tauri/runtime）：
      # 完整体积策略见 docs/PERFORMANCE.md；在此构建产物即最终安装包。
      - name: 全量构建（turbo + cargo release）
        run: node scripts/build-all.mjs

      - name: Tauri 打包（NSIS + MSI）
        run: pnpm --filter @dsh-platform/desktop tauri:build

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-platform-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: 发布 GitHub Release（tag 触发或手动输入 release_tag）
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem "target/release/bundle/nsis/*.exe"
          if (-not $files) { Write-Error "NSIS 产物未找到"; exit 1 }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "${{ github.event.inputs.release_tag }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error "手动触发时必须填写 release_tag（如 v0.1.2）"
            exit 1
          }
          # release 不存在则创建；已存在则追加资产
          gh release create $tag $files.FullName --generate-notes 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag $files.FullName --clobber
